swap;\n  src: url(\"4fc195b3-7746-4ba9-9022-1f0cadcacc49\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d4c43ef9-f5e0-4e4b-be33-e7d0fc363cd8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* accent — deep rose-red */\n  :root {\n    --color-accent: #c93851;\n    --color-accent-100: #fbf0f2;\n    --color-accent-200: #f4dade;\n    --color-accent-300: #eabcc3;\n    --color-accent-400: #da8593;\n    --color-accent-500: #d05266;\n    --color-accent-600: #b02a41;\n    --color-accent-700: #8b1d30;\n    --color-accent-800: #6a1725;\n    --color-accent-900: #48141d;\n  }\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: \"Archivo\", system-ui, sans-serif; }\n  a { color: var(--color-accent); }\n  a:hover { color: var(--color-accent-700); }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: var(--color-bg)\">\n\n  <header style=\"position: sticky; top: 0; z-index: 20; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 18px 48px; background: var(--color-bg); border-bottom: 2px solid var(--color-divider)\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor: pointer; font-weight: 900; font-size: 17px; letter-spacing: -0.02em; text-transform: uppercase\">Amee Tran<span style=\"color: var(--color-accent)\">.<\u002Fspan><\u002Fdiv>\n    <nav style=\"display: flex; align-items: baseline; gap: 28px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap\">\n      <div sc-camel-on-click=\"{{ goWork }}\" style=\"cursor: pointer\" style-hover=\"color: var(--color-accent)\">Work<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goAbout }}\" style=\"cursor: pointer\" style-hover=\"color: var(--color-accent)\">About<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goStack }}\" style=\"cursor: pointer\" style-hover=\"color: var(--color-accent)\">Stack<\u002Fdiv>\n      <a href=\"{{ githubHref }}\" target=\"_blank\" style=\"text-decoration: none; color: inherit\" style-hover=\"color: var(--color-accent)\">GitHub<\u002Fa>\n      <a href=\"{{ mailHref }}\" class=\"btn btn-primary\" style=\"letter-spacing: 0.06em; white-space: nowrap; flex: 0 0 auto\">Email me<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <section id=\"hero\" style=\"padding: 96px 48px 56px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"max-width: 1240px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 64px; align-items: end\">\n        <div>\n          <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 24px\">AI Engineer — Utrecht, NL<\u002Fdiv>\n          <h1 style=\"font-size: clamp(52px, 8vw, 104px); line-height: 0.94; letter-spacing: -0.035em; margin: 0 0 28px; text-transform: uppercase\">I build language<br>models that do<br>actual work<span style=\"color: var(--color-accent)\">.<\u002Fspan><\u002Fh1>\n          <p style=\"font-size: 21px; line-height: 1.45; max-width: 640px; margin: 0; text-wrap: pretty\">MSc Artificial Intelligence at Vrije Universiteit Amsterdam. I take LLMs out of the demo stage — local inference, structured extraction, graceful fallbacks, and evaluation harnesses that say how well it actually works.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 0; border-top: 2px solid var(--color-divider)\">\n          <div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--color-divider); font-size: 13px\">\n            <span style=\"letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Now<\u002Fspan>\n            <span style=\"font-weight: 600; text-align: right\">MSc AI, Deepening AI track<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--color-divider); font-size: 13px\">\n            <span style=\"letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Before<\u002Fspan>\n            <span style=\"font-weight: 600; text-align: right\">Data Science Intern, 2Contact<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--color-divider); font-size: 13px\">\n            <span style=\"letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Based in<\u002Fspan>\n            <span style=\"font-weight: 600; text-align: right\">Amsterdam, Netherlands<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ openToWork }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: flex; align-items: center; gap: 20px; padding: 14px 48px; background: var(--color-accent); color: var(--color-bg); border-bottom: 2px solid var(--color-divider)\">\n      <span style=\"font-size: 13px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase\">Open to AI / ML engineering roles &amp; internships — 2026<\u002Fspan>\n      <a href=\"{{ mailHref }}\" style=\"font-size: 13px; font-weight: 600; color: var(--color-bg); text-decoration: underline; text-underline-offset: 3px\">Get in touch<\u002Fa>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <section id=\"work\" style=\"padding: 72px 48px 0; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 40px\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">Selected work<\u002Fh2>\n        <span style=\"font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Three projects · 2024—2026<\u002Fspan>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ goNail }}\" style=\"display: grid; grid-template-columns: 88px minmax(0, 1fr) 300px; gap: 40px; padding: 36px 0; border-top: 2px solid var(--color-divider); cursor: pointer\" style-hover=\"background: color-mix(in srgb, var(--color-text) 4%, transparent)\">\n        <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; color: var(--color-accent)\">01<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size: 38px; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 12px\">Nail Salon Booking Assistant<\u002Fh3>\n          <p style=\"font-size: 17px; max-width: 620px; margin: 0 0 16px\">A local Llama 3.1 model turns messy chat messages into validated bookings — with a rule-based fallback that never leaves a customer without an answer.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Local GGUF inference<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Pydantic<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Streamlit<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">SQLite<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 12px; align-content: start\">\n          <div style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">39 evaluated test cases<\u002Fdiv>\n          <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">Read case study →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ goCook }}\" style=\"display: grid; grid-template-columns: 88px minmax(0, 1fr) 300px; gap: 40px; padding: 36px 0; border-top: 2px solid var(--color-divider); cursor: pointer\" style-hover=\"background: color-mix(in srgb, var(--color-text) 4%, transparent)\">\n        <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; color: var(--color-accent)\">02<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size: 38px; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 12px\">Cooking Assistant Agent<\u002Fh3>\n          <p style=\"font-size: 17px; max-width: 620px; margin: 0 0 16px\">A voice-capable recipe agent where a neural intent layer hands off to Prolog — so ingredient logic is explainable instead of hallucinated.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Dialogflow CX<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Prolog<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Speech-to-text<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 12px; align-content: start\">\n          <div style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Neuro-symbolic hand-off<\u002Fdiv>\n          <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">Read case study →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ goSenti }}\" style=\"display: grid; grid-template-columns: 88px minmax(0, 1fr) 300px; gap: 40px; padding: 36px 0; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); cursor: pointer\" style-hover=\"background: color-mix(in srgb, var(--color-text) 4%, transparent)\">\n        <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; color: var(--color-accent)\">03<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size: 38px; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 12px\">Customer Voice Pipeline<\u002Fh3>\n          <p style=\"font-size: 17px; max-width: 620px; margin: 0 0 16px\">At 2Contact: scraped forum threads, classified satisfaction with OpenAI models, and put the whole ETL on GitHub Actions so the weekly report wrote itself.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Python<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">OpenAI API<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">GitHub Actions<\u002Fspan>\n            <span class=\"tag tag-outline\" style=\"white-space: nowrap\">Dashboarding<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 12px; align-content: start\">\n          <div style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Internship · 2Contact, 2024<\u002Fdiv>\n          <div style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">Read case study →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"about\" style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">About<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; max-width: 900px\">\n          <div>\n            <p style=\"font-size: 19px; line-height: 1.5; margin: 0 0 16px; text-wrap: pretty\">I studied AI at VU Amsterdam because I wanted to understand systems end to end — the model, the data around it, and the person on the other side of the screen.<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Two years as a teaching assistant taught me to explain hard things simply, and to notice where people actually get stuck. That shows up in how I build: clear failure modes, honest evaluation, no magic.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 16px; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">During my internship at 2Contact I sat between the sales department and the data — turning vague questions into metrics, then into automated pipelines other people could rely on.<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Now I'm in the Deepening AI track of my master's, spending most of my time on LLM systems: extraction, agents, retrieval, and how to prove they work.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"stack\" style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">Skills &amp; stack<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider)\">\n          <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n            <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px\">Languages<\u002Fdiv>\n            <div style=\"font-size: 16px; line-height: 1.9\">Python<br>R<br>SQL · SPARQL<br>HTML<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n            <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px\">Machine learning<\u002Fdiv>\n            <div style=\"font-size: 16px; line-height: 1.9\">PyTorch · TensorFlow<br>Large language models<br>Deep learning<br>Knowledge graphs<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n            <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px\">Data<\u002Fdiv>\n            <div style=\"font-size: 16px; line-height: 1.9\">Data wrangling &amp; mining<br>Exploratory analysis<br>Hypothesis testing<br>Dashboarding<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n            <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 14px\">Tooling<\u002Fdiv>\n            <div style=\"font-size: 16px; line-height: 1.9\">Git · GitHub Actions<br>Docker<br>MLflow · Airflow<br>Flask · Streamlit · Postman<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 96px 48px; background: var(--color-accent); color: var(--color-bg)\">\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 64px; align-items: end\">\n        <div>\n          <h2 style=\"font-size: clamp(40px, 6vw, 76px); line-height: 0.98; letter-spacing: -0.03em; margin: 0 0 24px; text-transform: uppercase; color: var(--color-bg)\">Let's build<br>something that<br>ships.<\u002Fh2>\n          <a href=\"{{ mailHref }}\" style=\"font-size: 20px; font-weight: 600; color: var(--color-bg); text-decoration: underline; text-underline-offset: 6px\">{{ email }}<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 10px; font-size: 14px; color: var(--color-bg)\">\n          <div style=\"border-top: 2px solid var(--color-bg); padding-top: 12px\">Amsterdam, Netherlands<\u002Fdiv>\n          <div>+31 6 26 22 9536<\u002Fdiv>\n          <a href=\"{{ githubHref }}\" target=\"_blank\" style=\"color: var(--color-bg); text-decoration: underline; text-underline-offset: 3px\">github.com/amee342<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isNail }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section style=\"padding: 56px 48px 64px; border-bottom: 2px solid var(--color-divider)\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 40px\">← All work<\u002Fdiv>\n      <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 20px\">Case study 01 — NLP systems<\u002Fdiv>\n      <h1 style=\"font-size: clamp(44px, 6.5vw, 84px); line-height: 0.96; letter-spacing: -0.03em; margin: 0 0 28px; text-transform: uppercase; max-width: 15ch\">Nail Salon Booking Assistant<\u002Fh1>\n      <p style=\"font-size: 21px; line-height: 1.45; max-width: 720px; margin: 0\">A text-based booking agent that reads a sentence like \"hi, can I get a mani tomorrow at 2?\" and turns it into a validated, stored appointment — running a quantised Llama 3.1 entirely on the local machine, with a regex layer underneath that always succeeds.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"padding: 0 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-left: 2px solid var(--color-divider)\">\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Role<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Sole author — NLP coursework MVP<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Stack<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">llama-cpp · Pydantic · Streamlit · SQLite<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Model<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Meta-Llama-3.1-8B-Instruct, Q2_K GGUF<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Source<\u002Fdiv>\n          <a href=\"https://github.com/amee342/nail-booking-assistant\" target=\"_blank\" style=\"font-size: 16px; font-weight: 600\">nail-booking-assistant ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 56px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <figure>\n        <div class=\"grayscale\" style=\"border: 2px solid var(--color-divider)\">\n          <img src=\"37fd51c5-4f9c-4c10-9f21-bb069f37978e\" alt=\"Streamlit chat interface of the booking assistant with the appointment sidebar\" style=\"width: 100%; display: block\">\n        <\u002Fdiv>\n        <figcaption style=\"font-size: 12px; margin-top: 10px\">The Streamlit interface — chat history on the left, confirmed appointments in the sidebar.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">The problem<\u002Fh2>\n        <div style=\"max-width: 720px\">\n          <p style=\"font-size: 19px; line-height: 1.5; margin: 0 0 16px\">Small salons lose bookings to the phone. Customers write in free text, out of order, and half the time they leave out the one field you need — so a form-shaped chatbot just interrogates them until they give up.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">The interesting constraint was privacy and cost: no customer message should leave the machine, and no per-token bill. That ruled out hosted APIs and pushed the whole system onto local quantised inference — which in turn made robustness the real design problem, because a Q2_K model will sometimes hand you broken JSON.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 40px\">How it works<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider)\">\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">01<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Message in<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Free-text chat turn arrives with the conversation state so far.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">02<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Extract<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Local Llama is prompted for strict JSON: service, date, time, name, contact — validated by Pydantic.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">03<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Fall back<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">If the JSON is invalid, regex patterns take over — aliases (\"mani\" → manicure), dates, times, emails, phones. Always returns something.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">04<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Validate<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Service checked against the menu, slot checked against the calendar, missing fields turned into one polite follow-up question at a time.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">05<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Book<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Appointment written to SQLite, confirmation rendered, state reset for the next customer.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">Decisions I'd defend<\u002Fh2>\n        <div style=\"max-width: 760px; display: grid; gap: 0; border-top: 2px solid var(--color-divider)\">\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Two-stage extraction beats one clever prompt<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">The model is allowed to fail. Every extraction records its source (<code>llm<\u002Fcode> or <code>rule<\u002Fcode>) and a confidence score, so failures are visible in the logs instead of silently degrading the conversation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">State lives outside the model<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">New fields are merged into a plain dict, so a half-finished booking survives a bad turn and the assistant only ever asks for what's genuinely missing.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Unavailable is an answer, not an error<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">A taken slot returns the remaining times for that date; a full day asks for another. The booking flow never dead-ends.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Measured, not vibed<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">A 39-case harness scores intent and service accuracy per run and writes a results CSV, so a prompt change can be judged instead of argued about.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">Limits &amp; next<\u002Fh2>\n        <div style=\"max-width: 720px\">\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 16px; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">It's an MVP and says so: no Twilio, no calendar sync, no accounts or payments, single language. The Q2_K quantisation trades quality for speed and still trips on ambiguous phrasing.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">The path to production I'd take next: few-shot examples and a higher-quality quantisation for extraction, Google Calendar for real availability, then Twilio for inbound calls and SMS confirmations.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 56px 48px; display: flex; justify-content: space-between; gap: 24px; align-items: center\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">← All work<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goCook }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">Next: Cooking Assistant Agent →<\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCook }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section style=\"padding: 56px 48px 64px; border-bottom: 2px solid var(--color-divider)\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 40px\">← All work<\u002Fdiv>\n      <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 20px\">Case study 02 — Conversational AI<\u002Fdiv>\n      <h1 style=\"font-size: clamp(44px, 6.5vw, 84px); line-height: 0.96; letter-spacing: -0.03em; margin: 0 0 28px; text-transform: uppercase; max-width: 15ch\">Cooking Assistant Agent<\u002Fh1>\n      <p style=\"font-size: 21px; line-height: 1.45; max-width: 720px; margin: 0\">A recipe assistant you can talk to. Dialogflow CX handles intent and dialogue; a Prolog knowledge base answers the questions that need to be right — what can I substitute, what's still missing, does this fit what's in my kitchen.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"padding: 0 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-left: 2px solid var(--color-divider)\">\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Role<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Design &amp; build — university project<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Stack<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Dialogflow CX · Prolog · Speech-to-text API<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Shape<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Neuro-symbolic: NLU in, rules out<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Input<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Voice or text<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">The problem<\u002Fh2>\n        <div style=\"max-width: 720px\">\n          <p style=\"font-size: 19px; line-height: 1.5; margin: 0 0 16px\">Cooking is the worst possible time to use a screen. Your hands are busy, the question is specific, and a wrong answer ruins dinner.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">A pure language model is fluent about recipes and unreliable about facts. So the language layer only decides <em>what was asked<\u002Fem> — the answer itself comes from rules that can be inspected and corrected.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 40px\">How it works<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider)\">\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">01<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Speech to text<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Voice input is transcribed so the user never has to touch the phone mid-recipe.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">02<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Intent &amp; entities<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Dialogflow CX classifies the request and pulls out dishes, ingredients and constraints, keeping context across turns.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">03<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Prolog reasoning<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Recipe rules match ingredients on hand, find substitutions and rank what's actually cookable tonight.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">04<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Spoken answer<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">The rule result is filled into the dialogue response — grounded, short, and traceable back to a fact.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">What I took from it<\u002Fh2>\n        <div style=\"max-width: 760px; display: grid; gap: 0; border-top: 2px solid var(--color-divider)\">\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Draw the line between fluent and correct<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Language models are good at understanding, symbolic layers are good at being right. Most useful assistants need both, with a clean interface between them.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Voice changes the copy<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Anything longer than two sentences is unlistenable. Designing for speech forced answers to be short and unambiguous — which made the text version better too.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Rules are documentation<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">When behaviour is wrong, you can point at the clause. That debuggability is why I reach for hybrid designs on anything domain-specific.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 56px 48px; display: flex; justify-content: space-between; gap: 24px; align-items: center\">\n      <div sc-camel-on-click=\"{{ goNail }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">← Nail Booking Assistant<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goSenti }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">Next: Customer Voice Pipeline →<\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSenti }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section style=\"padding: 56px 48px 64px; border-bottom: 2px solid var(--color-divider)\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 40px\">← All work<\u002Fdiv>\n      <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 20px\">Case study 03 — Applied data science<\u002Fdiv>\n      <h1 style=\"font-size: clamp(44px, 6.5vw, 84px); line-height: 0.96; letter-spacing: -0.03em; margin: 0 0 28px; text-transform: uppercase; max-width: 15ch\">Customer Voice Pipeline<\u002Fh1>\n      <p style=\"font-size: 21px; line-height: 1.45; max-width: 720px; margin: 0\">Six months at 2Contact turning an open question from the sales department — \"what are customers actually unhappy about?\" — into an automated weekly report nobody had to assemble by hand.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"padding: 0 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-left: 2px solid var(--color-divider)\">\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Role<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Data Science Intern, 2Contact<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Period<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">June — December 2024<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Stack<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Python · OpenAI API · GitHub Actions<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 8px\">Outcome<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 600\">Manual reporting effort removed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">The problem<\u002Fh2>\n        <div style=\"max-width: 720px\">\n          <p style=\"font-size: 19px; line-height: 1.5; margin: 0 0 16px\">The business had thousands of public forum posts about its service and no way to read them. The question arrived unscoped, so the first job was turning it into something measurable.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">I worked with my supervisor to agree what \"satisfaction\" would mean in numbers and which problem categories mattered to the sales team, before writing a line of pipeline code.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 40px\">The pipeline<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider)\">\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">01<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Scrape<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Python scripts collect customer feedback threads from the KPN community forum.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">02<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Classify<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">OpenAI models infer satisfaction and tag recurring customer-service problems against the agreed categories.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">03<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Automate<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">GitHub Actions runs the ETL on a schedule — the manual data-processing step disappeared.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 24px; border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider)\">\n          <div style=\"font-size: 13px; font-weight: 800; color: var(--color-accent); margin-bottom: 12px\">04<\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 800; margin-bottom: 8px\">Report<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">A weekly dashboard and satisfaction report land with concrete suggestions for the next period.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 72px 48px; border-bottom: 2px solid var(--color-divider)\">\n      <div style=\"display: grid; grid-template-columns: clamp(130px, 16vw, 300px) minmax(0, 1fr); gap: clamp(32px, 4vw, 64px)\">\n        <h2 style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 0\">What I took from it<\u002Fh2>\n        <div style=\"max-width: 760px; display: grid; gap: 0; border-top: 2px solid var(--color-divider)\">\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Define the metric before the model<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">The hardest part wasn't classification — it was agreeing with stakeholders on what counted as a satisfied customer.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">An analysis nobody reruns is a one-off<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Putting the ETL in CI is what turned a slide deck into a standing part of how the team reviews its week.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 20px 0; border-bottom: 1px solid var(--color-divider)\">\n            <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 6px\">Write for the reader, not the notebook<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent)\">Sales didn't want distributions; they wanted two things to fix. Every report ended with recommendations, not charts.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: 56px 48px; display: flex; justify-content: space-between; gap: 24px; align-items: center\">\n      <div sc-camel-on-click=\"{{ goCook }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">← Cooking Assistant Agent<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent)\">All work →<\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; padding: 28px 48px; border-top: 2px solid var(--color-divider); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">\n    <span>Amee Tran — AI Engineer<\u002Fspan>\n    <span style=\"position: relative\">AMSTERDAM, NL<\u002Fspan>\n    <a href=\"{{ mailHref }}\">{{ email }}<\u002Fa>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ameetran.businesscontact@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;githubUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://github.com/amee342&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;openToWork&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { route: 'home' };\n\n  go(route) {\n    this.setState({ route }, () => window.scrollTo(0, 0));\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (this.state.route !== 'home') {\n      this.setState({ route: 'home' }, () => {\n        const t = document.getElementById(id);\n        if (t) window.scrollTo(0, t.offsetTop - 70);\n      });\n    } else if (el) {\n      window.scrollTo({ top: el.offsetTop - 70, behavior: 'smooth' });\n    }\n  }\n\n  renderVals() {\n    const email = this.props.email ?? 'ameetran.businesscontact@gmail.com';\n    const github = this.props.githubUrl ?? 'https://github.com/amee342';\n    const r = this.state.route;\n    return {\n      email,\n      mailHref: 'mailto:' + email,\n      githubHref: github,\n      openToWork: this.props.openToWork ?? true,\n      isHome: r === 'home',\n      isNail: r === 'nail',\n      isCook: r === 'cook',\n      isSenti: r === 'senti',\n      goHome: () => this.go('home'),\n      goNail: () => this.go('nail'),\n      goCook: () => this.go('cook'),\n      goSenti: () => this.go('senti'),\n      goWork: () => this.scrollTo('work'),\n      goAbout: () => this.scrollTo('about'),\n      goStack: () => this.scrollTo('stack')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
